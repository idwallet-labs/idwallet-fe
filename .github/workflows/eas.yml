name: eas

on:
  workflow_dispatch:
    inputs:
      run_update:
        description: "Publish preview update"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_android_build:
        description: "Start Android preview build"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  update-preview:
    if: inputs.run_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dlx eas-cli@20.5.1 update --channel preview --environment preview --message "$GITHUB_SHA" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  android-preview-build:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx eas-cli@20.5.1 build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
